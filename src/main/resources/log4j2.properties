status = error
name = FaultManagementLog4j2Config

appender.console.type = Console
appender.console.name = consoleLogger
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

appender.file.type = File
appender.file.name = fileLogger
appender.file.fileName = logs/fault-management.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = consoleLogger
rootLogger.appenderRef.file.ref = fileLogger

logger.app.name = com.infy
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRefs = console, file
logger.app.appenderRef.console.ref = consoleLogger
logger.app.appenderRef.file.ref = fileLogger
