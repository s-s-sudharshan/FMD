# Bean Validation messages for request DTOs (Jakarta Validation / Hibernate Validator
# resolves {key} placeholders in @NotBlank/@NotNull/etc. against this file automatically
# via ResourceBundleMessageInterpolator -- no extra configuration needed).
#
# Convention: <feature>.<field>.<condition>
# Identical "field is required" messages are intentionally shared across DTOs
# (see auth.* keys below) rather than duplicated per-DTO, since the wording is
# genuinely the same validation across the Auth module's request DTOs.

auth.username.absent=Username is required
auth.password.absent=Password is required
auth.currentPassword.absent=Current password is required
auth.newPassword.absent=New password is required
auth.confirmPassword.absent=Confirm password is required
auth.answer.absent=Answer is required
