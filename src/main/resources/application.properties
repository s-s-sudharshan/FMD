spring.application.name=fault-management

spring.datasource.url=jdbc:mysql://localhost:3306/fault_management

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Added for Phase 1: without a ddl-auto strategy, the `users` table has no
# schema-creation path yet (plan.md's TableScript.sql doesn't exist yet
# either) and Login/Register would fail against an empty database.
# "update" is a dev-time convenience; swap for a real migration tool or the
# reference TableScript.sql before anything resembling production.
spring.jpa.hibernate.ddl-auto=update

server.port=8765

# Added for Phase 1 SecurityConfig: the single allowed CORS origin for the
# credentialed React SPA (plan.md Section 8 - credentialed requests can't use
# a wildcard origin). Override via env/args for other environments.
app.cors.allowed-origin=http://localhost:3000

# Phase 1 user-facing messages, externalized from Java code per course
# convention. Service.* keys are used as exception messages in AuthServiceImpl
# and resolved back to text in GlobalExceptionHandler; API.* keys are success
# messages returned by AuthAPI/UserAPI; General.* keys are used by the
# Spring-Security-level handlers (RestAuthenticationEntryPoint,
# RestAccessDeniedHandler) and the generic exception fallback.
Service.USER_NOT_FOUND=User not found.
Service.INVALID_CREDENTIALS=Wrong username or password.
Service.CURRENT_PASSWORD_INCORRECT=Current password is incorrect.
Service.USER_DEACTIVATED=User is Deactivated.
Service.WEAK_PASSWORD=Password must be at least {0} characters long.
Service.PASSWORD_MISMATCH=New password and confirm password do not match.
Service.INVALID_SECRET_ANSWER=Secret answer is incorrect.
Service.FORGOT_PASSWORD_NOT_VERIFIED=Secret answer must be verified before resetting the password.
Service.FORGOT_PASSWORD_VERIFICATION_EXPIRED=Secret answer verification has expired; please verify the secret answer again.
Service.DUPLICATE_USERNAME=Username already exists.
Service.SAME_ROLE=User already has the specified role.

API.LOGIN_SUCCESS=Login successful.
API.LOGOUT_SUCCESS=Logout successful.
API.PASSWORD_CHANGE_SUCCESS=Password changed successfully.
API.SECRET_QUESTION_RETRIEVED=Secret question retrieved.
API.SECRET_ANSWER_VERIFIED=Secret answer verified.
API.PASSWORD_RESET_SUCCESS=Password reset successful.
API.CSRF_COOKIE_ISSUED=CSRF cookie issued.
API.USERS_RETRIEVED=Users retrieved successfully.
API.USER_ADDED=User added successfully.
API.ROLE_CHANGED=User role changed successfully.
API.USER_DEACTIVATED=User deactivated successfully.

General.UNAUTHORIZED_MESSAGE=Authentication is required to access this resource.
General.ACCESS_DENIED_MESSAGE=You do not have permission to perform this action.
General.EXCEPTION_MESSAGE=An unexpected error occurred. Please try again later.
