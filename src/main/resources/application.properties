spring.application.name=fault-management

spring.datasource.url=jdbc:mysql://localhost:3306/fault_management

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

server.port=8765

app.cors.allowed-origin=http://localhost:3000

app.simulator.enabled=true
app.simulator.interval-ms=30000
app.simulator.initial-delay-ms=10000
app.simulator.max-alarms-per-run=3

