spring.application.name=fault-management

spring.datasource.url=jdbc:mysql://localhost:3306/fault_management

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Added for Phase 1: without a ddl-auto strategy, the `users` table has no
# schema-creation path yet (plan.md's TableScript.sql doesn't exist yet
# either) and Login/Register would fail against an empty database.
# "update" is a dev-time convenience; swap for a real migration tool or the
# reference TableScript.sql before anything resembling production.
spring.jpa.hibernate.ddl-auto=update

# Added for Phase 1 SecurityConfig: the single allowed CORS origin for the
# credentialed React SPA (plan.md Section 8 - credentialed requests can't use
# a wildcard origin). Override via env/args for other environments.
app.cors.allowed-origin=http://localhost:3000

app.forgot-password.verification-ttl-minutes=5
